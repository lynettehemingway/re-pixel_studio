name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check website
        run: |
          npm run check
          npm test
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir _site
          cp index.html games.html team.html contact.html styles.css app.js _site/
          cp -R assets game_assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
